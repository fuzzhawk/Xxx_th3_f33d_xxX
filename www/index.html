<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>The Feed</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icon.svg">
  <script src="build-info.js" onerror="window.BUILD={branch:'main',sha:'dev',date:''}"></script>
</head>
<body>
  <header id="top">
    <div class="brand"><span class="eye">◉</span> the feed</div>
    <button id="timer" class="timer" aria-label="Usage today">0:00</button>
  </header>

  <main>
    <section id="view-feed" class="view active" aria-label="Feed">
      <div id="feed-spacer"></div>
      <div id="feed"></div>
      <div id="feed-sentinel" class="sentinel">…</div>
    </section>
    <section id="view-favs" class="view" aria-label="Favorites"></section>
    <section id="view-settings" class="view" aria-label="Settings"></section>
  </main>

  <nav id="tabs">
    <button data-tab="feed" class="active"><span>≋</span>Feed</button>
    <button data-tab="favs"><span>♥</span>Favorites</button>
    <button data-tab="settings"><span>⚙</span>Settings</button>
  </nav>

  <div id="stats" class="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head"><h2>Your usage</h2><button class="close" data-close>✕</button></div>
      <div id="stats-body"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
