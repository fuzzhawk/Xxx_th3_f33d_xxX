<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>The Feed</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="build-info.js" onerror="window.BUILD={branch:'main',sha:'dev',date:''}"></script>
</head>
<body>
  <header id="top">
    <div class="brand"><span class="dot"></span>the feed</div>
    <button id="timer" class="timer" aria-label="Usage today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>0:00</span></button>
  </header>

  <main>
    <section id="view-feed" class="view active" aria-label="Feed">
      <div id="stories"></div>
      <div id="feed-spacer"></div>
      <div id="feed"></div>
      <div id="feed-sentinel" class="sentinel">…</div>
    </section>
    <section id="view-favs" class="view" aria-label="Favorites"></section>
    <section id="view-settings" class="view" aria-label="Settings"></section>
  </main>

  <nav id="tabs">
    <button data-tab="feed" class="active" aria-label="Feed"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button data-tab="favs" aria-label="Favorites"><svg class="i" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9C1 8.4 2.8 4.8 6.4 4.8c2.2 0 3.7 1.2 5.6 3.3 1.9-2.1 3.4-3.3 5.6-3.3 3.6 0 5.4 3.6 4 6.7-2.1 4.4-9.6 9-9.6 9z"/></svg></button>
    <button data-tab="stats" aria-label="Usage"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button data-tab="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><i class="badge-dot"></i></button>
  </nav>

  <div id="stats" class="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head"><h2>Your usage</h2><button class="close" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="stats-body"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
