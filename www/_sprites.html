<!doctype html><html><head><meta charset="utf-8"><style>body{background:#1a1512;margin:0} canvas{image-rendering:pixelated;width:120px;margin:4px;background:#2a221c}</style></head><body><div id="w"></div>
<script type="module">
import { monster, humanoid } from './js/games/creature.js';
const idx = await (await fetch('assets/kenney/index.json')).json();
const im = (f) => { const i = new Image(); i.src = 'assets/kenney/' + f; return i; };
const tex = (idx.roles.tile || []).slice(0, 30).map(im);
const heads = Object.entries(idx.files).filter(([, f]) => f.cut && ['char', 'item', 'ship', 'deco'].includes(f.role)).map(([n]) => im(n));
await new Promise((r) => setTimeout(r, 800));
const w = document.getElementById('w');
for (let k = 0; k < 21; k++) { const m = monster(1000 + k * 77, k * 40, 16 + (k % 3) * 4, k % 4, { tex: tex[k % tex.length], head: k % 3 === 0 ? heads[k % heads.length] : null }); w.append(m.frames[0]); }
w.append(document.createElement('br'));
for (let k = 0; k < 14; k++) { const h = humanoid(500 + k * 31, k * 50, { tex: tex[(k * 3) % tex.length], head: k % 4 === 0 ? heads[(k * 5) % heads.length] : null }); for (const f of [h.idle, h.walk[0], h.punch]) w.append(f); }
</script></body></html>
