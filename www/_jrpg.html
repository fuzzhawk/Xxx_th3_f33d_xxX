<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="css/style.css"></head><body><canvas id="c" style="width:360px;height:420px"></canvas>
<script type="module">
import { loadKenney, setThemes } from './js/games/assets.js';
import { Jrpg } from './js/games/jrpg.js';
await loadKenney();
const q = new URLSearchParams(location.search), s = +(q.get('s')||1), k = q.get('k');
if (k) setThemes([{ id: 'k-' + k, kind: 'kenney', pack: k, name: k, hue: 40 }]);
const theme = k ? { id: 'k-' + k, v: 0, name: k } : { proc: true, name: 'Test', hue: s*47%360, seed: s*1000 };
const g = new Jrpg(document.getElementById('c'), { id:'t', cat:'game', sub:'jrpg', seed: s*7919+5, title:'t', theme, mods: q.get('mods') ? q.get('mods').split(',') : undefined });
window.g = g; g.start();
</script></body></html>
