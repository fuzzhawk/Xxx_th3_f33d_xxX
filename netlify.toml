# Web version of The Feed. Netlify builds this automatically from the repo:
# it bundles the newest package into www/ and publishes www/.
[build]
  command = "node tools/bundle-package.mjs"
  publish = "www"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/bundled/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
