name: Fetch game assets

on:
  push:
    paths:
      - 'tools/fetch-assets.mjs'
      - 'tools/data/assets.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Kenney packs
        run: node tools/fetch-assets.mjs 2>&1 | tee assets.log
      - name: Commit assets
        run: |
          git config user.name "the-feed-bot"
          git config user.email "the-feed-bot@users.noreply.github.com"
          git add www/assets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update game assets from Kenney (CC0)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done

  apk:
    needs: fetch
    uses: ./.github/workflows/apk.yml
    with:
      ref: ${{ github.ref_name }}
