name: Build weekly package

# Runs when packages/request.json changes (that is how a new package is requested),
# or by hand from the Actions tab.
on:
  push:
    paths:
      - 'packages/request.json'
  workflow_dispatch:
    inputs:
      id:
        description: 'Package id, e.g. 2026-W43 (blank = current ISO week)'
        required: false

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build package
        run: |
          ID="${{ github.event.inputs.id }}"
          if [ -z "$ID" ] && [ -f packages/request.json ]; then ID=$(node -p "require('./packages/request.json').id || ''"); fi
          node tools/build-package.mjs ${ID:+--id "$ID"} 2>&1 | tee build.log
          echo '### Package build' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 build.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit package
        run: |
          git config user.name "the-feed-bot"
          git config user.email "the-feed-bot@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add package $(node -p "require('./packages/index.json').latest")"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done

  apk:
    needs: build
    uses: ./.github/workflows/apk.yml
    with:
      ref: ${{ github.ref_name }}
