name: Fetch garden plants

# Pulls CC0 plant sprites from Kenney packs into www/assets/plants (the garden shows a different
# handful each day), commits them to the branch and rebuilds the APK.
on:
  push:
    paths:
      - 'tools/fetch-plants.mjs'
      - 'tools/data/plants.json'
      - '.github/workflows/plants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download plant sprites
        run: node tools/fetch-plants.mjs 2>&1 | tee plants.log
      - name: Commit plants
        run: |
          git config user.name "the-feed-bot"
          git config user.email "the-feed-bot@users.noreply.github.com"
          git add www/assets/plants
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Garden plant sprites from Kenney (CC0)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done

  apk:
    needs: fetch
    uses: ./.github/workflows/apk.yml
    with:
      ref: ${{ github.ref_name }}
